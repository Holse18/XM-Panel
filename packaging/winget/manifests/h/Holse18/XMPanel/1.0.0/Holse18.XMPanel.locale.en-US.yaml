ShortDescription: Windows tray companion for Sony WH-1000X headphones (noise canceling, ambient sound, EQ and headset settings).
Description: |-
  XM Panel controls Sony WH-1000X headphones from the Windows taskbar over Bluetooth: switch noise canceling and
  ambient sound, use EQ presets and custom EQ profiles, change DSEE Extreme, Speak-to-Chat, Touch Controls and other
  headset settings, see the battery level, and restore your preferred settings every time the headset connects.
  WH-1000XM4 tested; WH-1000XM3 should work; WH-1000XM5/XM6 experimental. Not affiliated with Sony.
